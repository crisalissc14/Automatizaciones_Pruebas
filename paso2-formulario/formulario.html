<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paso 2 - Formulario de pago</title>
  <link rel="stylesheet" href="formulario.css">
</head>
<body>

  <form class="payment-form" action="#" method="post">
    <h1>Formulario de Pago</h1>
    <p class="required-note">Todos los campos son OBLIGATORIOS</p>

    <div class="form-row">
      <label for="fname">Nombres</label>
      <input type="text" id="fname" name="fname" required>
    </div>

    <div class="form-row">
      <label for="lname">Apellidos</label>
      <input type="text" id="lname" name="lname" required>
    </div>

    <div class="form-row">
      <label for="address">Dirección</label>
      <input type="text" id="address" name="address" required>
    </div>

    <div class="form-row">
      <label for="city">Ciudad</label>
      <input type="text" id="city" name="city" required>
    </div>

    <div class="form-row">
      <label for="state">Provincia/Estado</label>
      <input type="text" id="state" name="state" required>
    </div>

    <div class="form-row">
      <label for="zip">Código Postal</label>
      <input type="text" id="zip" name="zip" required>
    </div>

    <fieldset class="card-type">
      <legend>Tipo de Tarjeta de Crédito</legend>

      <input type="radio" id="mastercard" name="cardtype" value="MasterCard" required>
      <label for="mastercard">MasterCard</label>

      <input type="radio" id="visa" name="cardtype" value="VISA">
      <label for="visa">VISA</label>

      <input type="radio" id="discover" name="cardtype" value="Discover">
      <label for="discover">Discover</label>
    </fieldset>

    <div class="form-row">
      <label for="cardnum">Número de Tarjeta de Crédito</label>
      <input type="text" id="cardnum" name="cardnum" required>
    </div>

    <div class="form-row">
      <label for="expMonth">Fecha de Expiración</label>
      <select id="expMonth" name="expMonth" required>
        <option value="">--Mes--</option>
        <option value="01">Ene</option>
        <option value="02">Feb</option>
        <option value="03">Mar</option>
        <option value="04">Abr</option>
        <option value="05">May</option>
        <option value="06">Jun</option>
        <option value="07">Jul</option>
        <option value="08">Ago</option>
        <option value="09">Sep</option>
        <option value="10">Oct</option>
        <option value="11">Nov</option>
        <option value="12">Dic</option>
      </select>

      <select id="expYear" name="expYear" required>
        <option value="">--Año--</option>
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
        <option value="2029">2029</option>
        <option value="2030">2030</option>
        <option value="2031">2031</option>
      </select>
    </div>

    <div class="form-row">
      <label for="comment">Código de Seguridad</label>
      <textarea id="comment" name="comment" cols="1" rows="1" placeholder="Inserte el código de seguridad de la tarjeta"></textarea>
    </div>

    <button type="submit" name="submit" value="Enviar Pago">Enviar Pago</button>
  </form>

</body>
</html>
